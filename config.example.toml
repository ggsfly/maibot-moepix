[plugin]
# 是否启用插件。关闭后插件保持空闲，不会注册任何工具或命令。
enabled = true
# 配置结构版本号，用于配置迁移和兼容性判断。请勿手动修改。
config_version = "1.1.0"

[r18]
# 扩展内容白名单（管理员名单，仅通过 WebUI 配置编辑器维护，插件和 AI 均不会写入本文件）。
# 群聊与私聊分开填写，直接填群号 / QQ 号即可，无需手动加前缀。
# 只有出现在白名单中的群聊/私聊用户才能请求扩展内容。
# 生效名单 = 下面的两张列表（管理员维护）∪ 插件数据目录 data/plugins/<插件id>/r18_whitelist.json（AI 通过工具维护）。
# 注意：AI 无法关闭写在本列表中的会话权限；未在两份名单中的会话，无论命令还是 AI 调用，均不可请求扩展内容。

# 允许请求扩展内容的群聊白名单（填群号即可）。
group_allowed_chats = []

# 允许请求扩展内容的私聊用户白名单（填 QQ 号即可）。
user_allowed_chats = []

[api]
# Lolicon API 地址。一般无需修改，除非使用自建 API 代理。
base_url = "https://api.lolicon.app/setu/v2"

# 默认图片规格（WebUI 中为下拉多选，可选值见下方注释）。可选值：
#   - "original"：原始分辨率（文件较大）
#   - "regular"：标准分辨率（推荐，默认）
#   - "small"：小尺寸缩略图
#   - "thumb"：极小缩略图
#   - "mini"：微型缩略图
# 注意：部分旧作品可能仅支持 "original" 规格。
default_size = ["regular"]

# 图片反代域名。仅在未填写下方 network_proxy 时生效。
# 留空则不向 Lolicon 指定反代，使用其默认的 i.pixiv.re（公共反代，速度较慢）。
# 常见反代选项：
#   - "i.pixiv.re"：Cloudflare 反代（可能间歇性不可用）
#   - 其他可用的 Pixiv 反代域名
proxy = ""

# 网络连接代理。填入本机代理地址后，API 请求与图片下载都会经过它，
# 并自动改用 Pixiv 官方图床 i.pximg.net（国内实测可达 1 MB/s 以上）。
# 常见写法："http://127.0.0.1:7890"（Clash / v2ray 默认端口）。
# 留空表示不使用代理，此时按上面的反代配置下载。
network_proxy = ""

# 是否排除 AI 生成的作品。建议保持 true，避免潜在的版权争议。
exclude_ai = true

# 单次请求允许获取的最大图片数量。防止滥用，范围 1-3。
max_num = 3

# 发送模式（WebUI 中为下拉单选）。控制图片以何种形式发送到聊天：
#   - "image"：直接发送图片（默认，体验最好但可能被审查）
#   - "link"：只发送图片链接文本（安全，不会被审查，但需要用户自行打开）
#   - "both"：同时发送图片和链接（兼顾体验和安全）
#   - "kz_link"：全年龄内容发图片，扩展内容发链接（推荐用于防审查场景）
send_mode = "image"

# 合并转发（聊天记录）发送。开启后所有条目（图/链接）打包成一条聊天记录，不刷屏：
#   - both / kz_link 的链接文本并入对应图片节点（或作为纯文本节点）；
#   - link 模式全部为纯文本节点。
# 撤回会对整条转发生效（图和链接一起撤），取决于适配器对转发消息撤回的支持，失败有日志。
use_forward = false

# 同时下载几张图（1-5）。反代较慢时调小可减少超时，带宽好时调大更快。
max_concurrent_downloads = 3

[limits]
# 频率限制：每分钟最多请求次数。
# 作用于所有请求方式（AI 工具调用和 /tu 命令）。
rate_per_minute = 3

# 限频维度（WebUI 中为下拉单选）：
#   - "chat"：同一会话共享次数（默认，防止群内刷屏）
#   - "user"：同一用户各自计算次数（更公平，适合私聊较多的场景）
rate_scope = "chat"

# 色图发送后自动撤回的延迟秒数。
# 设为 0 表示不撤回（图片永久保留）。
# 建议群聊场景设置 60-180 秒，私聊场景可设为 0。
# 注意：撤回功能依赖平台适配器支持，若不支持则静默跳过。
recall_after_seconds = 90

[anti_detect]
# 防风控设置：降低图片/链接被平台检测导致封号的概率。
# 依赖 Pillow（MaiBot 主程序已内置）。

# 发送前是否对图片做随机小角度旋转（改变感知哈希）。
# 不旋转时图片仅可选重编码，防风控效果较弱。
image_rotate_enabled = true

# 随机旋转角度范围（度）。每次发送在 [最小, 最大] 区间内随机取值并随机正负方向。
# 角度越小越不易被肉眼察觉。
rotate_min_degrees = 0.5
rotate_max_degrees = 2.5

# 是否将图片重编码为 JPEG（也会改变文件 MD5）。
# 关闭则保留原格式画质，但失去这一步防风控；在意画质（如 original 原图）时建议关闭。
jpeg_recompress_enabled = true

# 重编码 JPEG 画质（1-95）。建议 85-92，过低会明显影响观感。
jpeg_quality = 88

# 是否对发送的图片链接做伪装。
# 伪装方式：去掉 https:// 协议头，并把域名中的第一个和最后一个 "." 替换为指定字符，
# 例如 "i.pximg.net/img/a.jpg" → "i点pximg点net/img/a.jpg"。
# 路径和扩展名保持原样，用户还原链接时只需改回域名里的少量字符。
link_obfuscate_enabled = true

# 链接伪装时用于替换域名点号的字符，默认汉字"点"。
link_dot_replacement = "点"